name: Local review demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install HWP reader
        run: npm install --global --omit=optional --ignore-scripts --no-audit --no-fund kordoc@4.24.45 pdfjs-dist@4.10.38
      - run: python -m unittest discover -s tests -v
