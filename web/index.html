<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Folio Wiki · 지침 검토</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
    <script src="/notices.js" defer></script>
  </head>
  <body>
    <aside>
      <div class="wordmark">
        <b>F</b><span>Folio <em>Wiki</em></span>
      </div>
      <div class="workspace">
        <small>작업 공간</small><strong id="space">공개 폴더</strong>
      </div>
      <nav aria-label="작업 메뉴">
        <button data-view="review">지침 검토</button
        ><button data-view="wiki">팀 위키</button
        ><button data-view="sources">원문 보관함</button
        ><button data-view="history">결정 기록</button>
        <button data-view="notices">공고 가져오기</button>
      </nav>
      <div class="engine"><i></i><span id="engine">엔진 연결 중</span></div>
    </aside>
    <main>
      <header>
        <span
          >작업 공간 <span class="slash">/</span>
          <strong id="crumb"></strong></span
        ><button id="sync" class="quiet">자료 다시 읽기</button>
      </header>
      <section id="desk" aria-label="작업 내용"></section>
    </main>
    <dialog id="reader">
      <div class="dialoghead">
        <h2>원문 보기</h2>
        <button id="close" class="quiet">닫기</button>
      </div>
      <div id="paper"></div>
    </dialog>
    <p id="toast" role="status" hidden></p>
  </body>
</html>
